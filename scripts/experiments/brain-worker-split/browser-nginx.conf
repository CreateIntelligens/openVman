server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;
    include /etc/nginx/admin-routes.conf;
    location = /admin { return 302 /admin/; }
    location /api/v1/internal/ { return 404; }
    location /brain/ { return 404; }
    location /api/ {
        proxy_pass http://split-backend:8200;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /v1/ {
        proxy_pass http://split-backend:8200;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location /static/ {
        proxy_pass http://split-backend:8200;
    }
    location / {
        proxy_pass http://split-avatar:80;
    }
}
