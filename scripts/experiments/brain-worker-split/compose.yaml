# No repo .env, production data, GPU reservation, host ports, build, or watchtower.
x-brain: &brain
  image: ${WORKER_BRAIN_IMAGE:-tbdavid2019/openvman-api:latest}
  user: "0:0"
  labels:
    com.centurylinklabs.watchtower.enable: "false"
  volumes:
    - ../../../brain/api:/app:ro
    - ../../../contracts:/contracts:ro
    - ./fixture-skills:/skills:ro
    - .:/experiments:ro
    - brain-data:/data
  environment: &brain-env
    ENV: prod
    PYTHONPATH: /app
    PYTHONDONTWRITEBYTECODE: "1"
    DEFAULT_PROJECT_ID: synthetic-worker-split
    BRAIN_ROLE: admin
    BRAIN_WORKERS: "1"
    BRAIN_THREAD_POOL_SIZE: ${WORKER_THREAD_POOL_SIZE:-0}
    BRAIN_COORDINATION_DIR: /data/.coordination
    GATEWAY_INTERNAL_TOKEN: synthetic-worker-internal-token
    GATEWAY_BASE_URL: http://split-backend:8200
    LLM_PROVIDER: openai
    LLM_MODEL: synthetic-chat
    LLM_API_KEY: synthetic-not-an-external-key
    LLM_BASE_URL: http://fake-llm:8080/v1
    LLM_FALLBACK_CHAIN: openai:synthetic-chat
    LLM_DISABLE_MODEL_DISCOVERY: "true"
    EMBEDDING_SERVICE_URL: http://openvman-embedding-1:8009
    EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_TEST_TOKEN:?Set only the existing embedding service token}
    TURN_DECISIONS_ENABLED: ${TURN_DECISIONS_ENABLED:-false}
    JEV_LANGUAGE_ENABLED: ${JEV_LANGUAGE_ENABLED:-false}
    JEV_MEMORY_GATE_ENABLED: ${JEV_MEMORY_GATE_ENABLED:-false}
    ASR_FINAL_JUDGE_ENABLED: "false"
    AUTO_RECALL_USE_JEV_FILTER: ${AUTO_RECALL_USE_JEV_FILTER:-false}
    AUTO_RECALL_USE_LLM_SUMMARIZER: ${AUTO_RECALL_USE_LLM_SUMMARIZER:-false}
    NO_ANSWER_JUDGE_ENABLED: ${NO_ANSWER_JUDGE_ENABLED:-false}
    CHAT_REFERENCE_MEDIA_DECISION_ENABLED: ${CHAT_REFERENCE_MEDIA_DECISION_ENABLED:-false}
    PRIVACY_FILTER_ENABLED: ${PRIVACY_FILTER_ENABLED:-false}
    URL2MD_SEARCH_ENABLED: "false"
    URL2MD_READ_ENABLED: "false"
    WIKI_PUBLISH_ENABLED: "false"
    DREAMING_ENABLED: "false"
    SESSION_BACKUP_ENABLED: "false"
    REQUEST_RATE_LIMIT_PER_MINUTE: "100000"
  networks: [isolated, embedding]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/brain/health/ready',timeout=3).read()"]
    interval: 3s
    timeout: 5s
    retries: 60

services:
  fake-llm:
    image: ${WORKER_BACKEND_IMAGE:-tbdavid2019/openvman-backend:latest}
    entrypoint: [python, /experiments/fake_llm.py]
    volumes: [".:/experiments:ro"]
    environment:
      FAKE_LLM_FIRST_SECONDS: ${FAKE_LLM_FIRST_SECONDS:-0.8}
      FAKE_LLM_GAP_SECONDS: ${FAKE_LLM_GAP_SECONDS:-0.02}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks: [isolated]

  fake-tts:
    image: ${WORKER_BACKEND_IMAGE:-tbdavid2019/openvman-backend:latest}
    entrypoint: [python, /experiments/fake_tts.py]
    volumes: [".:/experiments:ro"]
    environment:
      FAKE_TTS_MAX_CONCURRENCY: ${FAKE_TTS_MAX_CONCURRENCY:-0}
      FAKE_TTS_FIRST_CHUNK_SECONDS: ${FAKE_TTS_FIRST_CHUNK_SECONDS:-0.3}
      FAKE_TTS_SECONDS_PER_CHAR: ${FAKE_TTS_SECONDS_PER_CHAR:-0.12}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks: [isolated]

  fake-hub:
    image: ${WORKER_BACKEND_IMAGE:-tbdavid2019/openvman-backend:latest}
    entrypoint: [python, /experiments/fake_hub.py]
    volumes: [".:/experiments:ro"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks: [isolated]

  redis:
    image: redis:7-alpine
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks: [isolated]

  split-admin:
    <<: *brain
    entrypoint: [python, /experiments/bootstrap.py, brain]
    depends_on: [fake-llm, redis]

  split-chat:
    <<: *brain
    entrypoint: [python, /app/main.py]
    environment:
      <<: *brain-env
      BRAIN_ROLE: chat
      BRAIN_WORKERS: ${WORKER_COUNT:-4}
    depends_on:
      split-admin:
        condition: service_healthy

  split-backend:
    image: ${WORKER_BACKEND_IMAGE:-tbdavid2019/openvman-backend:latest}
    user: "0:0"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    entrypoint: [python, /experiments/bootstrap.py, backend]
    volumes:
      - ../../../backend/app:/app/app:ro
      - ../../../contracts:/contracts:ro
      - .:/experiments:ro
      - brain-data:/brain-data:ro
      - backend-data:/data
    environment:
      ENV: prod
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      DEFAULT_PROJECT_ID: synthetic-worker-split
      BRAIN_URL: http://split-admin:8100
      BRAIN_CHAT_URL: http://split-chat:8100
      GATEWAY_INTERNAL_TOKEN: synthetic-worker-internal-token
      SESSION_JWT_SECRET: synthetic-worker-jwt-secret-at-least-32-bytes
      MODEL_PROVIDER_ENCRYPTION_SECRET: synthetic-model-secret-at-least-32-bytes
      AUTH_ROOT_USERNAME: worker-load
      AUTH_DATABASE_PATH: /data/auth/accounts.db
      REDIS_URL: redis://redis:6379
      GATEWAY_TEMP_DIR: /data/gateway-temp
      TTS_EDGE_ENABLED: ${TTS_EDGE_ENABLED:-true}
      UPSTREAM_PROBE_INTERVAL_SECONDS: "0"
      A2A_ENABLED: ${A2A_ENABLED:-false}
      A2A_HUB_URL: ${A2A_HUB_URL:-http://fake-hub:8095}
      A2A_HUB_KEY: ${A2A_HUB_KEY:-synthetic-a2a-circle}
      A2A_ALLOW_PUBLIC_CIRCLE: ${A2A_ALLOW_PUBLIC_CIRCLE:-false}
      A2A_DISPLAY_NAME: ${A2A_DISPLAY_NAME:-openVman}
      A2A_DEFAULT_PROJECT_ID: ${A2A_DEFAULT_PROJECT_ID:-synthetic-worker-split}
      A2A_ALLOW_GROUP_BROADCAST: ${A2A_ALLOW_GROUP_BROADCAST:-true}
      A2A_LEADER_LEASE_TTL_SECONDS: ${A2A_LEADER_LEASE_TTL_SECONDS:-6}
      A2A_ORPHAN_SWEEP_INTERVAL_SECONDS: ${A2A_ORPHAN_SWEEP_INTERVAL_SECONDS:-30}
      A2A_MAX_TASKS_PER_MINUTE: ${A2A_MAX_TASKS_PER_MINUTE:-60}
      A2A_CREDENTIALS_PATH: /data/a2a/credentials.json
      A2A_QUEUE_DB_PATH: /data/a2a/work_queue.db
      # 預設接本機假 TTS；設 FAKE_TTS_URL= 空字串就回到只用 Edge。
      TTS_INDEXTTS_URL: ${FAKE_TTS_URL-http://fake-tts:8090}
      BACKEND_WORKERS: ${BACKEND_WORKERS:-1}
      UVICORN_TIMEOUT_WORKER_HEALTHCHECK: ${UVICORN_TIMEOUT_WORKER_HEALTHCHECK:-}
      TTS_COSYVOICE_URL: ""
      TTS_VOXCPM_URL: ""
    depends_on:
      split-chat:
        condition: service_healthy
    networks: [isolated]

  client:
    image: ${WORKER_BACKEND_IMAGE:-tbdavid2019/openvman-backend:latest}
    entrypoint: [python, /experiments/load.py]
    volumes:
      - .:/experiments:ro
      - ../../../backend/app:/app/app:ro
      - backend-data:/data
      - results:/results
      - brain-data:/brain-data:ro
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379
      SESSION_JWT_SECRET: synthetic-worker-jwt-secret-at-least-32-bytes
      A2A_HUB_URL: ${A2A_HUB_URL:-http://fake-hub:8095}
      A2A_HUB_KEY: ${A2A_HUB_KEY:-synthetic-a2a-circle}
      A2A_CREDENTIALS_PATH: /data/a2a/credentials.json
      A2A_QUEUE_DB_PATH: /data/a2a/work_queue.db
      WORKER_COUNT: ${WORKER_COUNT:-4}
      WORKER_THREAD_POOL_SIZE: ${WORKER_THREAD_POOL_SIZE:-0}
    depends_on: [split-backend]
    networks: [isolated]
    profiles: [test]

networks:
  isolated: {}
  embedding:
    external: true
    name: openvman_default

volumes:
  brain-data: {}
  backend-data: {}
  results: {}
