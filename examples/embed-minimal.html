<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openVman Avatar SDK Minimal</title>
    <style>
      body {
        background: #eef3f4;
        display: grid;
        margin: 0;
        min-height: 100dvh;
        place-items: center;
      }

      button {
        font: inherit;
        padding: 0.75rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <label>
        選擇音訊
        <input id="audio-file" type="file" accept="audio/*" disabled>
      </label>
      <button id="stop" type="button" disabled>停止</button>
    </main>

    <script src="https://YOUR_OPENVMAN_HOST/openvman-avatar-sdk.js"></script>
    <script>
      const audioFile = document.querySelector("#audio-file");
      const stopButton = document.querySelector("#stop");
      let avatar;

      OpenVmanAvatar.init({
        characterId: "000",
      }).then((instance) => {
        avatar = instance;
        audioFile.disabled = false;
        stopButton.disabled = false;
        avatar.on("error", ({ code, message }) => {
          console.error(code, message);
        });
      }).catch((error) => {
        console.error(error.code, error.message);
      });

      audioFile.addEventListener("change", () => {
        const file = audioFile.files?.[0];
        if (file) void avatar?.playAudio(file);
      });

      stopButton.addEventListener("click", () => {
        avatar?.interrupt();
      });
    </script>
  </body>
</html>
