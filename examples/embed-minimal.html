<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openVman Avatar SDK Minimal</title>
    <style>
      body {
        background: #eef3f4;
        display: grid;
        margin: 0;
        min-height: 100dvh;
        place-items: center;
      }

      button {
        font: inherit;
        padding: 0.75rem 1rem;
      }
    </style>
  </head>
  <body>
    <button id="greet" type="button" disabled>請虛擬人打招呼</button>

    <script src="https://YOUR_OPENVMAN_HOST/openvman-avatar-sdk.js"></script>
    <script>
      const button = document.querySelector("#greet");
      let avatar;

      OpenVmanAvatar.init({
        apiKey: "PASTE_API_KEY",
        characterId: "000",
      }).then((instance) => {
        avatar = instance;
        button.disabled = false;
        avatar.on("error", ({ code, message }) => {
          console.error(code, message);
        });
      }).catch((error) => {
        console.error(error.code, error.message);
      });

      button.addEventListener("click", () => {
        void avatar?.speak("你好，歡迎使用 openVman");
      });
    </script>
  </body>
</html>
