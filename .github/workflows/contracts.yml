name: Contracts

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "brain/api/**"
      - "brain/embedding/**"
      - "brain/skills/**"
      - "frontend/**"
      - "tests/test_entry_boundaries.py"
      - "docs/**"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.adoc"
      - "**/*.txt"
      - "examples/**"
      - "scripts/experiments/**"
      - "scripts/voice_e2e/cases/**"
      - "scripts/check_document_privacy.py"
      - "scripts/check_changelog.py"
      - "tests/test_changelog.py"
      - "tests/test_sdk_docker_inputs.py"
      - "tests/test_document_privacy.py"
      - "contracts/**"
      - "brain/api/protocol/**"
      - "brain/api/tests/contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
      - master

# 只 checkout 跑測試，不需要寫 repo。
permissions:
  contents: read

jobs:
  protocol-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check generated contracts are up to date
        run: python3 contracts/scripts/generate_protocol_contracts.py --check

      - name: Install backend test dependencies
        run: python3 -m pip install pytest "pydantic>=2.0.0,<3" "pydantic-settings>=2.0.0"

      - name: Check owned documentation privacy
        run: python3 scripts/check_document_privacy.py

      - name: Test documentation privacy checks
        run: python3 -m pytest tests/test_document_privacy.py -q

      - name: Check CHANGELOG has one section per day
        run: python3 scripts/check_changelog.py

      - name: Test CHANGELOG layout checks
        run: python3 -m pytest tests/test_changelog.py -q

      - name: Check the SDK image stage copies every shared import
        run: python3 -m pytest tests/test_sdk_docker_inputs.py -q

      - name: Run backend protocol tests
        run: python3 -m pytest brain/api/tests/contracts/test_protocol_events.py -v

      - name: Check entrypoint boundaries and owned source sizes
        run: python3 -m pytest tests/test_entry_boundaries.py -q
