name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "Rebuild openvman-backend-base even if Dockerfile.base is unchanged"
        type: boolean
        default: false

permissions:
  contents: read

# 同一分支只建最新的 commit：連續 push 讓多個 run 同時寫同一個 GHA 快取 scope，
# 會互相覆蓋而出現 "cache entry no longer exists"，而且舊 commit 的映像也沒人要。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # backend 的 parser stack（docling / Rust 編譯的 pdf-inspector）建一次要半小時以上，
  # 而且幾乎不會變。它獨立成 openvman-backend-base，只在 Dockerfile.base 有改動、
  # Docker Hub 上還沒有、或手動要求時才重建；backend 每次 push 只疊 requirements 與 app。
  backend-base:
    name: backend-base (linux/amd64,linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Decide whether the base image needs rebuilding
        id: decide
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/openvman-backend-base:latest
          FORCE: ${{ github.event.inputs.rebuild_base }}
        run: |
          reason=""
          if [ "$FORCE" = "true" ]; then
            reason="workflow_dispatch rebuild_base"
          elif ! git diff --quiet HEAD~1 HEAD -- backend/Dockerfile.base 2>/dev/null; then
            reason="backend/Dockerfile.base changed"
          elif ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            reason="$IMAGE not on Docker Hub"
          fi
          if [ -n "$reason" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding base: $reason"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Base image up to date, skipping"
          fi

      - name: Set up QEMU
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push base image
        if: steps.decide.outputs.rebuild == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openvman-backend-base:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openvman-backend-base:${{ github.sha }}
          cache-from: type=gha,scope=backend-base
          cache-to: type=gha,mode=max,scope=backend-base,ignore-error=true

  build-and-push:
    name: ${{ matrix.image }} (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    needs: backend-base
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU/web images publish a linux/amd64 + linux/arm64 manifest.
          # backend builds FROM openvman-backend-base (see the backend-base job).
          - image: backend
            context: ./backend
            file: ./backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: admin
            context: .
            file: ./frontend/admin/Dockerfile
            target: runner
            platforms: linux/amd64,linux/arm64
          - image: avatar
            context: .
            file: ./frontend/app/Dockerfile
            platforms: linux/amd64,linux/arm64
          # CUDA/PyTorch images are amd64-only until ARM64 GPU dependencies
          # are available and verified for the production runtime.
          - image: api
            context: ./brain/api
            file: ./brain/api/Dockerfile
            platforms: linux/amd64
          - image: embedding
            context: ./brain/embedding
            file: ./brain/embedding/Dockerfile
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          platforms: ${{ matrix.platforms }}
          # pull 讓 backend 的 FROM 拿到剛推上去的 base，而不是 runner 上的舊快取。
          pull: true
          build-args: |
            BASE_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/openvman-backend-base:latest
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openvman-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openvman-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # 快取匯出失敗（配額輪替、並行覆蓋）不該讓已建好的映像推送失敗。
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
