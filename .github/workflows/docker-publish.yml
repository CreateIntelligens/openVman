name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只建最新的 commit：連續 push 讓多個 run 同時寫同一個 GHA 快取 scope，
# 會互相覆蓋而出現 "cache entry no longer exists"，而且舊 commit 的映像也沒人要。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: ${{ matrix.image }} (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU/web images publish a linux/amd64 + linux/arm64 manifest.
          - image: backend
            context: ./backend
            file: ./backend/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: admin
            context: .
            file: ./frontend/admin/Dockerfile
            target: runner
            platforms: linux/amd64,linux/arm64
          - image: avatar
            context: .
            file: ./frontend/app/Dockerfile
            platforms: linux/amd64,linux/arm64
          # CUDA/PyTorch images are amd64-only until ARM64 GPU dependencies
          # are available and verified for the production runtime.
          - image: api
            context: ./brain/api
            file: ./brain/api/Dockerfile
            platforms: linux/amd64
          - image: embedding
            context: ./brain/embedding
            file: ./brain/embedding/Dockerfile
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openvman-${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openvman-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # 快取匯出失敗（配額輪替、並行覆蓋）不該讓已建好的映像推送失敗。
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
