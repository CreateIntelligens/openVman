# Clef-Flash public API. Source of truth for /etc/nginx/conf.d/clef-api.conf.
# TLS terminates at the host nginx; the API facade listens on host loopback 18100.

server {
    listen 80;
    listen [::]:80;
    server_name clef.create360.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clef.create360.ai;

    ssl_certificate /home/human/openVman/infra/nginx/certs/letsencrypt/live/clef.create360.ai/fullchain.pem;
    ssl_certificate_key /home/human/openVman/infra/nginx/certs/letsencrypt/live/clef.create360.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CLEF_API_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
