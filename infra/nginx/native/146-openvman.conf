map $http_upgrade $openvman_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 146.5gao.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 146.5gao.ai;

    ssl_certificate /home/human/openVman/infra/nginx/certs/letsencrypt/live/146.5gao.ai/fullchain.pem;
    ssl_certificate_key /home/human/openVman/infra/nginx/certs/letsencrypt/live/146.5gao.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OPENVMAN_NATIVE_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /openvman {
        return 301 /openvman/;
    }

    location = /openvman/admin {
        return 301 /openvman/admin/;
    }

    # Strip the public path prefix before forwarding to the Docker edge.
    location /openvman/ {
        proxy_pass https://127.0.0.1:8787/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openvman_connection_upgrade;
        proxy_redirect ~^https?://[^/]+/admin/?$ /openvman/admin/;
        proxy_buffering off;
    }

    # Compatibility for root-relative page redirects emitted by older admin
    # bundles. Keep the Vite HMR path below as a live websocket proxy.
    location = /admin {
        return 301 /openvman$request_uri;
    }

    location = /admin/login {
        return 301 /openvman/admin/login;
    }

    location = /admin/chat {
        return 301 /openvman/admin/chat;
    }

    # Vite's admin HMR client uses /admin/ for its websocket endpoint.
    location ^~ /admin/ {
        proxy_pass https://127.0.0.1:8787;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openvman_connection_upgrade;
        proxy_buffering off;
    }

    # The current Vite dev bundles emit root-relative API, websocket, HMR,
    # and asset URLs. Keep those supporting paths on the same Docker edge.
    # The public SDK bundle and every served file now live under /static/,
    # so they no longer need their own root-level locations.
    location ~ ^/(admin|api|v1|static|src|@vite|@id|node_modules|js|wasm|grafana|vendor)(/|$) {
        proxy_pass https://127.0.0.1:8787;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openvman_connection_upgrade;
        proxy_buffering off;
    }

    location = /widget.html {
        proxy_pass https://127.0.0.1:8787;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = / {
        return 301 /openvman/;
    }

    location / {
        return 404;
    }
}
