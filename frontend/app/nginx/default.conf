# 虛擬人前端：純靜態檔。admin 的 nginx 把 / proxy 到這裡，WebSocket 與 /api 不經
# 過這裡（admin 直接送 backend），所以這份只管送檔案。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html 不能被快取：它記著當前這版的 chunk hash。舊的 index.html 配新的
    # 部署，點到還沒載入的頁面就會去要一個已經不存在的 chunk 而白屏。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 帶 hash 的產物內容不會變，可以永久快取；換版就是換檔名。
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public/ 底下的 wasm、vendor、js 沒帶 hash，換版時內容可能變，不要永久快取。
    location / {
        try_files $uri $uri/ =404;
    }
}
