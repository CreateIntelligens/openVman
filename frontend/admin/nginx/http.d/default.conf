limit_req_zone $binary_remote_addr zone=gpu_inference_rate:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=gpu_inference_conn:10m;

# HTTP(8786) 一律導向 HTTPS(8787)。攝影機/麥克風的 getUserMedia 只在安全
# 來源可用，且兩個 vite dev server 的 HMR 都指向 wss://…:8787 —— 從 HTTP
# 進來會靜默失去這些功能，所以直接把人導到正確的位置，而不是讓他自己發現。
server {
    listen 80;
    server_name _;

    # $host 不含埠號，補上對外的 HTTPS 埠。
    return 301 https://$host:8787$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # dev server 一次要載入上百個模組；HTTP/1.1 每個 host 只有 6 條並行
    # 連線，模組會排隊到十幾秒（1.9KB 的檔案也等 10s）。HTTP/2 用單一
    # 連線多工，把排隊消掉。
    http2 on;
    ssl_certificate /etc/nginx/certs/openvman.crt;
    ssl_certificate_key /etc/nginx/certs/openvman.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OPENVMAN_SSL:10m;
    ssl_session_timeout 1d;

    # ── Admin backend endpoints ───────────────────────────
    location /admin/dlq {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
    }

    # ── Admin frontend ───────────────────────────────────────
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }
    location /admin/ {
        proxy_pass http://localhost:5173;
        include /etc/nginx/http.d/proxy-params.conf;
        include /etc/nginx/http.d/websocket.conf;
        # dev server 的模組即時轉譯後直接串流給瀏覽器，不需要 nginx 緩衝。
        proxy_buffering off;
    }

    # ── Backend API (v1 + docs) ─────────────────────────────
    location /v1/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
    }

    location /documents/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        client_max_body_size 100m;
    }

    location /uploads {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        client_max_body_size 100m;
    }

    location /jobs/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
    }

    location = /openvman-avatar-sdk.js {
        alias /usr/share/nginx/html/openvman-avatar-sdk.js;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        default_type application/javascript;
    }

    location = /sdk/runtime/OpenVmanAvatarRuntime.js {
        resolver 127.0.0.11 valid=30s;
        set $avatar http://avatar:80;
        proxy_pass $avatar/js/DHLiveMini2.js;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        default_type application/javascript;
    }

    location = /sdk/runtime/OpenVmanAvatarRuntime.wasm {
        resolver 127.0.0.11 valid=30s;
        set $avatar http://avatar:80;
        proxy_pass $avatar/wasm/DHLiveMini2.wasm;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        default_type application/wasm;
    }

    location = /embed/avatar {
        return 410;
    }

    location = /vman-embed.js {
        return 410;
    }

    location /embed/ {
        return 410;
    }

    location /api/embed/ {
        return 410;
    }

    location /ws/embed/ {
        return 410;
    }

    # ── Public Avatar SDK character list ─────────────────────
    location = /characters {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ── Internal GPU Service Edge Proxy (embedding & vlm) ────
    location ~ ^/api/gpu/embedding/(.*)$ {
        resolver 127.0.0.11 valid=30s;
        set $embedding_upstream http://embedding:8009/$1$is_args$args;
        proxy_pass $embedding_upstream;
        include /etc/nginx/http.d/proxy-params.conf;
        proxy_set_header Authorization $http_authorization;
        limit_req zone=gpu_inference_rate burst=4 nodelay;
        limit_req_status 429;
        limit_conn gpu_inference_conn 2;
        limit_conn_status 429;
        client_max_body_size 10m;
        client_body_timeout 15s;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/gpu/vlm/(.*)$ {
        resolver 127.0.0.11 valid=30s;
        set $vlm_upstream http://vlm:8000/$1$is_args$args;
        proxy_pass $vlm_upstream;
        include /etc/nginx/http.d/proxy-params.conf;
        proxy_set_header Authorization $http_authorization;
        limit_req zone=gpu_inference_rate burst=4 nodelay;
        limit_req_status 429;
        limit_conn gpu_inference_conn 2;
        limit_conn_status 429;
        client_max_body_size 20m;
        client_body_timeout 15s;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ── Brain API (proxied via backend) ──────────────────────
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        include /etc/nginx/http.d/websocket.conf;
        proxy_redirect ~^https?://[^/]+/(.*) $scheme://$http_host/$1;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        include /etc/nginx/http.d/websocket.conf;
        proxy_buffering off;
        proxy_cache off;
    }

    # Brain is internal-only. Backend /docs exposes the merged public API.
    location /brain/ {
        return 404;
    }

    # ── Docs & OpenAPI ───────────────────────────────────────
    location /docs {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        proxy_redirect ~^https?://[^/]+/(.*) $scheme://$http_host/$1;
        include /etc/nginx/http.d/proxy-params.conf;
    }

    location /openapi.json {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
    }

    # ── TTS streaming (direct to IndexTTS for low-latency WAV stream) ──
    # Must be declared BEFORE the generic /tts/ prefix — nginx picks the
    # longest prefix match, so this wins for /tts/stream requests.
    # proxy_buffering MUST be off, otherwise nginx accumulates the full
    # response before forwarding, which defeats streaming playback.
    location /tts/stream {
        resolver 127.0.0.11 valid=30s;
        # 指向 backend，由其做 IndexTTS → Edge streaming → buffered 的 fallback。
        # 不可直送 index-tts-vllm，否則 IndexTTS 掛掉就直接 502，繞過 fallback。
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        client_max_body_size 1m;
    }

    # ── TTS ──────────────────────────────────────────────────
    location /tts/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
    }

    # ── Grafana (monitoring dashboard) ──────────────────────
    location /grafana/ {
        resolver 127.0.0.11 valid=30s;
        set $grafana http://grafana:3000;
        proxy_pass $grafana$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        include /etc/nginx/http.d/websocket.conf;
        proxy_redirect ~^https?://[^/]+/(.*) $scheme://$http_host/$1;
        proxy_buffering off;
    }
    # ── Avatar character assets (served by backend volume) ──
    location /assets/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        client_max_body_size 200m;
        # 角色影片有數 MB，緩衝只會先寫暫存檔再轉發；直接串流並保留 Range。
        proxy_buffering off;
    }
    # ── Avatar background assets (served by backend volume) ──
    location /backgrounds/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        client_max_body_size 50m;
    }
    # -- Avatar mascot VRM assets (served by backend volume) --
    location /mascots/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8200;
        proxy_pass $backend$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        client_max_body_size 100m;
        # VRM 模型可達 20MB，同 /assets/ 直接串流。
        proxy_buffering off;
    }
    # ── Avatar frontend (virtual human) ────────────────────
    location / {
        resolver 127.0.0.11 valid=30s;
        set $avatar http://avatar:80;
        proxy_pass $avatar$request_uri;
        include /etc/nginx/http.d/proxy-params.conf;
        include /etc/nginx/http.d/websocket.conf;
        # 同 /admin/：dev server 模組直接串流，不落暫存檔。
        proxy_buffering off;
    }
}
