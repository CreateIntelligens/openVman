# Production nginx config for the admin runner image.
# Serves the pre-built admin bundle and public Avatar SDK. Cross-service
# routing (backend, brain, tts, grafana, avatar) stays with the existing
# edge proxy, not this container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # VAD assets are part of the built bundle under /admin/ and served
    # as plain static files.
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Hashed JS/CSS/wasm assets are immutable — cache aggressively.
    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /openvman-avatar-sdk.js {
        alias /usr/share/nginx/html/openvman-avatar-sdk.js;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        default_type application/javascript;
    }
}
