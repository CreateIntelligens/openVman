# Production-only Admin routes included by the shared HTTPS edge server.
location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;
    # index.html names the current chunk hashes. A stale copy after a deploy asks
    # for files that no longer exist. SPA routes re-enter this location through the
    # try_files fallback, so they get the header too.
    add_header Cache-Control "no-cache";
}

# Hashed JS/CSS/wasm assets are immutable. No SPA fallback here: a missing chunk has
# to stay a 404, and without `always` that 404 carries no caching headers.
location /admin/assets/ {
    alias /usr/share/nginx/html/admin/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
