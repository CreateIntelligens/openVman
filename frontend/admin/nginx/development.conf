# Development-only Admin routes included by the shared HTTPS edge server.
location /admin/ {
    proxy_pass http://localhost:5173;
    include /etc/nginx/http.d/proxy-params.conf;
    include /etc/nginx/http.d/websocket.conf;
    # Vite modules are streamed directly so HMR updates are not buffered.
    proxy_buffering off;
}
