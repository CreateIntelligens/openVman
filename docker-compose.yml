# Production-first stack. Use docker-compose.dev.yml as an override when a
# worktree needs source bind mounts and frontend HMR.
x-shared: &shared
  environment: &tz
    - TZ=Asia/Taipei
  restart: unless-stopped

x-backend-runtime: &backend-runtime
  user: "${UID:-1000}:${GID:-1000}"
  image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-backend:${OPENVMAN_IMAGE_TAG:-latest}"
  labels:
    com.centurylinklabs.watchtower.enable: "true"
  volumes:
    - ./backend/data:/app/data
    - ./backend/logs:/app/logs
    - ./data:/data
    - ./brain/data:/brain-data:ro
    - ./backend/index-tts-vllm/assets:/indextts-assets:ro
    - ./backend/app/assets/tts_references:/indextts-assets/tts_references:ro
  env_file:
    - ./.env
  environment: &backend-environment
    - TZ=Asia/Taipei
    - REDIS_URL=redis://redis:6379
    - GATEWAY_TEMP_DIR=/data/gateway-temp
    - GATEWAY_FORWARD_URL=http://backend:8200
    - MEDIA_PROCESSING_TIMEOUT_MS=${MEDIA_PROCESSING_TIMEOUT_MS:-60000}
    - TTS_INDEXTTS_URL=${TTS_INDEXTTS_URL:-}
    - TTS_VOXCPM_URL=${TTS_VOXCPM_URL:-}
    - VISION_LLM_API_KEY=${VISION_LLM_API_KEY:-${GATEWAY_INTERNAL_TOKEN:-}}
    - AVATAR_ASSETS_DIR=/data/avatar
    - AVATAR_BACKGROUNDS_DIR=/data/backgrounds
    - AVATAR_MASCOTS_DIR=/data/mascots

services:
  api:
    <<: *shared
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: ./brain/api
      dockerfile: Dockerfile
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-api:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./brain/data:/data
      - ./brain/skills:/skills:ro
      - ./contracts:/contracts:ro
      - hf-cache:/home/appuser/.cache/huggingface
      - opf-cache:/home/appuser/.opf
      - triton-cache:/home/appuser/.triton
    env_file:
      - ./.env
    environment:
      - HOME=/home/appuser
      - OPF_MOE_TRITON=false
      - EMBEDDING_SERVICE_URL=${EMBEDDING_SERVICE_URL:-http://embedding:8009}
      - EMBEDDING_SERVICE_TOKEN=${EMBEDDING_SERVICE_TOKEN:-${GATEWAY_INTERNAL_TOKEN:-}}
      - EMBEDDING_EXPECTED_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_EXPECTED_DIMENSION=${EMBEDDING_EXPECTED_DIMENSION:-1024}
      - EMBEDDING_EXPECTED_REVISION=${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      - EMBEDDING_WRITE_IDENTITY=${EMBEDDING_WRITE_IDENTITY:-}
      - EMBEDDING_IDENTITY_ALIASES=${EMBEDDING_IDENTITY_ALIASES:-}
      - EMBEDDING_COMPATIBLE_LEGACY_IDENTITIES=${EMBEDDING_COMPATIBLE_LEGACY_IDENTITIES:-}
      - NEN_API_KEY=${NEN_API_KEY:-}
      - NEN_BASE_URL=${NEN_BASE_URL:-https://nen.com.tw/v1}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/brain/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  embedding:
    <<: *shared
    profiles: ["embedding"]
    build:
      context: ./brain/embedding
      dockerfile: Dockerfile
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-embedding:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    environment:
      - HF_HOME=/home/appuser/.cache/huggingface
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_MODEL_REVISION=${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cuda}
      - EMBEDDING_USE_FP16=${EMBEDDING_USE_FP16:-true}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - EMBEDDING_MAX_LENGTH=${EMBEDDING_MAX_LENGTH:-8192}
      - EMBEDDING_MAX_CONCURRENCY=${EMBEDDING_MAX_CONCURRENCY:-1}
      - EMBEDDING_COOLDOWN_SECONDS=${EMBEDDING_COOLDOWN_SECONDS:-60.0}
      - EMBEDDING_BEARER_TOKEN=${EMBEDDING_SERVICE_TOKEN:-${GATEWAY_INTERNAL_TOKEN:-}}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - EMBEDDING_GEMINI_MODEL=${EMBEDDING_GEMINI_MODEL:-gemini-embedding-001}
      - EMBEDDING_GEMINI_DIMENSIONS=${EMBEDDING_GEMINI_DIMENSIONS:-768}
      - EMBEDDING_GEMINI_BASE_URL=${EMBEDDING_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - EMBEDDING_OPENAI_MODEL=${EMBEDDING_OPENAI_MODEL:-text-embedding-3-small}
      - EMBEDDING_OPENAI_DIMENSIONS=${EMBEDDING_OPENAI_DIMENSIONS:-1536}
      - EMBEDDING_OPENAI_BASE_URL=${EMBEDDING_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_VOYAGE_MODEL=${EMBEDDING_VOYAGE_MODEL:-voyage-3-large}
      - EMBEDDING_VOYAGE_DIMENSIONS=${EMBEDDING_VOYAGE_DIMENSIONS:-1024}
      - EMBEDDING_VOYAGE_BASE_URL=${EMBEDDING_VOYAGE_BASE_URL:-https://api.voyageai.com/v1}
      - EMBEDDING_PROVIDER_TIMEOUT=${EMBEDDING_PROVIDER_TIMEOUT:-30.0}
      - EMBEDDING_PROVIDER_FALLBACKS=${EMBEDDING_PROVIDER_FALLBACKS:-bge,gemini,openai,voyage}
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; token=os.getenv('EMBEDDING_BEARER_TOKEN',''); req=urllib.request.Request('http://localhost:8009/health/ready', headers={'Authorization': f'Bearer {token}'} if token else {}); res=urllib.request.urlopen(req, timeout=8); sys.exit(0 if res.status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  index-tts-vllm:
    <<: *shared
    profiles: ["indextts"]
    build:
      context: ./backend/index-tts-vllm
      dockerfile: Dockerfile
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - CUDA_LAUNCH_BLOCKING=1
      - TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST:-8.9}
      - MODEL=${INDEXTTS_MODEL:-IndexTeam/IndexTTS-1.5}
      - VLLM_USE_MODELSCOPE=${INDEXTTS_USE_MODELSCOPE:-1}
      - DOWNLOAD_MODEL=${INDEXTTS_DOWNLOAD_MODEL:-1}
      - CONVERT_MODEL=${INDEXTTS_CONVERT_MODEL:-1}
      - MODEL_DIR=assets/checkpoints
      - PORT=8011
      - GPU_MEMORY_UTILIZATION=${INDEXTTS_GPU_MEM:-0.1}
      - INTERNAL_API_TOKEN=${GATEWAY_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/index-tts-vllm:/app
      - ./backend/app/assets/tts_references:/app/assets/tts_references:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; token=os.getenv('INTERNAL_API_TOKEN',''); req=urllib.request.Request('http://localhost:8011/health/ready', headers={'X-Internal-Token': token} if token else {}); res=urllib.request.urlopen(req, timeout=8); sys.exit(0 if res.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vlm:
    <<: *shared
    profiles: ["vlm"]
    image: vllm/vllm-openai:v0.24.0
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
      - VLLM_API_KEY=${GATEWAY_INTERNAL_TOKEN:-${VISION_LLM_API_KEY:-}}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${VLLM_API_KEY:-}" ]; then
          echo "VLLM_API_KEY is required for the local VLM service" >&2
          exit 1
        fi
        exec vllm serve "$$@" --api-key "$${VLLM_API_KEY}"
      - --
    command:
      - --model
      - ${VLM_MODEL:-Qwen/Qwen3-VL-4B-Instruct-FP8}
      - --served-model-name
      - openvman-vlm
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "1024"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "512"
      - --gpu-memory-utilization
      - ${VLM_GPU_MEMORY_UTILIZATION:-0.45}
      - --enforce-eager
      - --limit-mm-per-prompt
      - '{"image":1}'
      - --mm-processor-kwargs
      - '{"max_pixels":262144}'
      - --mm-processor-cache-gb
      - "0.5"
    volumes:
      - hf-cache:/root/.cache/huggingface
    shm_size: 8g
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; token=os.getenv('VLLM_API_KEY',''); req=urllib.request.Request('http://127.0.0.1:8000/v1/models', headers={'Authorization': f'Bearer {token}'} if token else {}); res=urllib.request.urlopen(req, timeout=5); sys.exit(0 if res.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  avatar:
    <<: *shared
    init: true
    build:
      context: .
      dockerfile: frontend/app/Dockerfile
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-avatar:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  admin:
    <<: *shared
    init: true
    build:
      context: .
      dockerfile: frontend/admin/Dockerfile
      target: runner
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-admin:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${PORT:-8786}:80"
      - "${HTTPS_PORT:-8787}:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs
    depends_on:
      - api
      - backend
      - avatar

  redis:
    <<: *shared
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  prometheus:
    <<: *shared
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - gateway_internal_token
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  grafana:
    <<: *shared
    image: grafana/grafana:10.4.2
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set to a strong unique value}
    depends_on:
      - prometheus

  backend:
    <<: [*shared, *backend-runtime]
    environment: *backend-environment
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy

  gateway-worker:
    <<: [*shared, *backend-runtime]
    environment: *backend-environment
    entrypoint: ["arq", "app.gateway.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  watchtower:
    <<: *shared
    image: containrrr/watchtower:1.7.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --api-version 1.44 --label-enable --interval 300 --cleanup

volumes:
  hf-cache:
  opf-cache:
  triton-cache:
  admin-node-modules:
  avatar-node-modules:
  redis-data:
  prometheus-data:
  grafana-data:

secrets:
  gateway_internal_token:
    environment: GATEWAY_INTERNAL_TOKEN
