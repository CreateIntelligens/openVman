# Production-first stack. Use docker-compose.dev.yml as an override when a
# worktree needs source bind mounts and frontend HMR.
x-shared: &shared
  environment: &tz
    - TZ=Asia/Taipei
  restart: unless-stopped

x-backend-runtime: &backend-runtime
  user: "${UID:-1000}:${GID:-1000}"
  image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-backend:${OPENVMAN_IMAGE_TAG:-latest}"
  labels:
    com.centurylinklabs.watchtower.enable: "true"
  volumes:
    - ./backend/data:/app/data
    - ./backend/logs:/app/logs
    - ./data:/data
    - ./brain/data:/brain-data:ro
  env_file:
    - ./.env
  environment: &backend-environment
    - TZ=Asia/Taipei
    - REDIS_URL=redis://redis:6379
    - GATEWAY_TEMP_DIR=/data/gateway-temp
    - GATEWAY_FORWARD_URL=http://backend:8200
    - MEDIA_PROCESSING_TIMEOUT_MS=${MEDIA_PROCESSING_TIMEOUT_MS:-60000}
    - TTS_INDEXTTS_URL=${TTS_INDEXTTS_URL:-}
    - TTS_INDEXTTS_NURSE_URL=${TTS_INDEXTTS_NURSE_URL:-}
    - TTS_INDEXTTS_NURSE_DEFAULT_CHARACTER=${TTS_INDEXTTS_NURSE_DEFAULT_CHARACTER:-hayley}
    - TTS_VOXCPM_URL=${TTS_VOXCPM_URL:-}
    - TTS_COSYVOICE_URL=${TTS_COSYVOICE_URL:-}
    - VISION_LLM_API_KEY=${VISION_LLM_API_KEY:-${GATEWAY_INTERNAL_TOKEN:-}}
    - AVATAR_ASSETS_DIR=/data/avatar
    - AVATAR_BACKGROUNDS_DIR=/data/backgrounds
    - AVATAR_JOBS_DIR=/data/avatar-jobs

services:
  api:
    <<: *shared
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: ./brain/api
      dockerfile: Dockerfile
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-api:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./brain/data:/data
      - ./brain/skills:/skills:ro
      - ./contracts:/contracts:ro
      - hf-cache:/home/appuser/.cache/huggingface
      - triton-cache:/home/appuser/.triton
    env_file:
      - ./.env
    environment:
      - HOME=/home/appuser
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPF_MOE_TRITON=false
      - EMBEDDING_SERVICE_TOKEN=${EMBEDDING_SERVICE_TOKEN:-${GATEWAY_INTERNAL_TOKEN:-}}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/brain/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            # CDI 模式：根治 systemd daemon-reload 洗掉 GPU cgroup 權限
            # （NVML Unknown Error、需 force-recreate 急救）的問題。
            # spec 在 /var/run/cdi/nvidia.yaml，nvidia-cdi-refresh 自動維護。
            - driver: cdi
              capabilities: [gpu]
              device_ids:
                - nvidia.com/gpu=all

  embedding:
    <<: *shared
    profiles: ["embedding"]
    build:
      context: ./brain/embedding
      dockerfile: Dockerfile
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-embedding:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    # 其餘設定（EmbeddingGemma 2 的模型、revision、批次大小）的預設值都在 brain/embedding/app.py；要覆寫才加。
    environment:
      - HF_HOME=/home/appuser/.cache/huggingface
      - EMBEDDING_BEARER_TOKEN=${EMBEDDING_SERVICE_TOKEN:-${GATEWAY_INTERNAL_TOKEN:-}}
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; token=os.getenv('EMBEDDING_BEARER_TOKEN',''); req=urllib.request.Request('http://localhost:8009/health/ready', headers={'Authorization': f'Bearer {token}'} if token else {}); res=urllib.request.urlopen(req, timeout=8); sys.exit(0 if res.status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            # CDI 模式：根治 systemd daemon-reload 洗掉 GPU cgroup 權限
            # （NVML Unknown Error、需 force-recreate 急救）的問題。
            # spec 在 /var/run/cdi/nvidia.yaml，nvidia-cdi-refresh 自動維護。
            - driver: cdi
              capabilities: [gpu]
              device_ids:
                - nvidia.com/gpu=all

  vlm:
    <<: *shared
    profiles: ["vlm"]
    image: vllm/vllm-openai:v0.24.0
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
      - VLLM_API_KEY=${GATEWAY_INTERNAL_TOKEN:-${VISION_LLM_API_KEY:-}}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${VLLM_API_KEY:-}" ]; then
          echo "VLLM_API_KEY is required for the local VLM service" >&2
          exit 1
        fi
        exec vllm serve "$$@" --api-key "$${VLLM_API_KEY}"
      - --
    command:
      - --model
      - ${VLM_MODEL:-Qwen/Qwen3-VL-4B-Instruct-FP8}
      - --served-model-name
      - openvman-vlm
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "1024"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "512"
      - --gpu-memory-utilization
      - ${VLM_GPU_MEMORY_UTILIZATION:-0.45}
      - --enforce-eager
      - --limit-mm-per-prompt
      - '{"image":1}'
      - --mm-processor-kwargs
      - '{"max_pixels":262144}'
      - --mm-processor-cache-gb
      - "0.5"
    volumes:
      - hf-cache:/root/.cache/huggingface
    shm_size: 8g
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; token=os.getenv('VLLM_API_KEY',''); req=urllib.request.Request('http://127.0.0.1:8000/v1/models', headers={'Authorization': f'Bearer {token}'} if token else {}); res=urllib.request.urlopen(req, timeout=5); sys.exit(0 if res.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            # CDI 模式：根治 systemd daemon-reload 洗掉 GPU cgroup 權限
            # （NVML Unknown Error、需 force-recreate 急救）的問題。
            # spec 在 /var/run/cdi/nvidia.yaml，nvidia-cdi-refresh 自動維護。
            - driver: cdi
              capabilities: [gpu]
              device_ids:
                - nvidia.com/gpu=all

  avatar:
    <<: *shared
    init: true
    build:
      context: .
      dockerfile: frontend/app/Dockerfile
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-avatar:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  admin:
    <<: *shared
    init: true
    build:
      context: .
      dockerfile: frontend/admin/Dockerfile
      target: runner
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-admin:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${PORT:-8786}:80"
      - "${HTTPS_PORT:-8787}:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs
    depends_on:
      - api
      - backend
      - avatar

  redis:
    <<: *shared
    image: redis:7-alpine
    # RDB 每幾分鐘存檔都印五行，只留警告以上
    command: ["redis-server", "--loglevel", "warning"]
    volumes:
      - redis-data:/data

  prometheus:
    <<: *shared
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - gateway_internal_token
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --log.level=warn

  grafana:
    <<: *shared
    image: grafana/grafana:10.4.2
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set to a strong unique value}
    depends_on:
      - prometheus

  backend:
    <<: [*shared, *backend-runtime]
    environment: *backend-environment
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy

  gateway-worker:
    <<: [*shared, *backend-runtime]
    environment: *backend-environment
    entrypoint: ["arq", "app.gateway.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  # 影片 → 虛擬人素材包。backend 把工作排進 Redis，這裡一次跑一件，產物寫回
  # 同一個 /data；image 只在 avatar-pipeline/ 變動時重建。
  avatar-pipeline:
    <<: *shared
    user: "${UID:-1000}:${GID:-1000}"
    image: "${DOCKERHUB_USERNAME:-tbdavid2019}/openvman-avatar-pipeline:${OPENVMAN_IMAGE_TAG:-latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./data:/data
    # 金鑰只放這個檔；沒有檔案時整個 stack 照常起來，只有轉換工作會失敗。
    env_file:
      - path: ./avatar-pipeline/.env
        required: false
    environment:
      - TZ=Asia/Taipei
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started

  watchtower:
    <<: *shared
    image: containrrr/watchtower:1.7.1
    environment:
      - DOCKER_API_VERSION=1.44
      - TZ=Asia/Taipei
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --api-version 1.44 --label-enable --interval 300 --cleanup

volumes:
  hf-cache:
  triton-cache:
  admin-node-modules:
  avatar-node-modules:
  redis-data:
  prometheus-data:
  grafana-data:

secrets:
  gateway_internal_token:
    environment: GATEWAY_INTERNAL_TOKEN
